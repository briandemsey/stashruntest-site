<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stashrun Test</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#080900;overflow:hidden}

    .screen{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }

    /* Single large diagonal S */
    .bg-s{
      position:absolute;
      top:50%;
      left:50%;
      width:160vw;
      height:auto;
      transform:translate(-50%,-50%) rotate(-20deg);
      pointer-events:none;
      z-index:0;
      opacity:0.4;
      filter:brightness(1.5);
      display:block;
    }

    nav{
      position:absolute;
      top:0;left:0;right:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:22px 24px;
    }

    nav img.logo{width:46px;height:46px;}

    .hamburger{display:flex;flex-direction:column;gap:7px;cursor:pointer;}
    .hamburger span{display:block;width:30px;height:3px;background:#fff;border-radius:2px;}

    .hero{
      position:absolute;
      bottom:14%;
      left:0;right:0;
      z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

    .hero img.wordmark{
      width:92vw;
      max-width:560px;
      height:auto;
    }

    .arrow{display:flex;flex-direction:column;align-items:center;}
    .arrow-shaft{width:2px;height:44px;background:#c8f500;}
    .arrow-tip{
      width:0;height:0;
      border-left:8px solid transparent;
      border-right:8px solid transparent;
      border-top:13px solid #c8f500;
    }

    .bottom-arc{
      position:absolute;
      left:-15%;right:-15%;bottom:-56px;
      height:105px;
      border-top:3px solid #c8f500;
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
      z-index:4;
      pointer-events:none;
    }

    .green-bar{
      position:absolute;
      bottom:0;left:0;right:0;
      height:4px;
      background:#c8f500;
      z-index:10;
    }
  </style>
</head>
<body>
<div class="screen">

  <img class="bg-s" src="bg-s.png" alt="" role="presentation" />

  <nav>
    <img class="logo" src="logo.png" alt="Stashrun" />
    <div class="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="hero">
    <img class="wordmark" src="wordmark.png" alt="STASHRUN" />
    <div class="arrow">
      <div class="arrow-shaft"></div>
      <div class="arrow-tip"></div>
    </div>
  </div>

  <div class="bottom-arc"></div>
  <div class="green-bar"></div>

</div>
</body>
</html>
